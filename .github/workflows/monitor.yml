name: Monitor Premier TV i VOD

on:
  schedule:
    # Uruchamianie codziennie o godzinie 06:00 UTC (07:00 / 08:00 czasu polskiego)
    - cron: '0 6 * * *'
  workflow_dispatch: # Możliwość ręcznego uruchomienia przyciskiem w zakładce Actions

permissions:
  contents: write

jobs:
  check-premieres:
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalacja bibliotek
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchomienie monitora premier
        run: python monitor.py

      - name: Zapis historii powiadomień w repozytorium
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizacja bazy wysłanych powiadomień [skip ci]" && git push)